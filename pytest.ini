[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    asyncio: mark test as async
    live_alpaca: requires live Alpaca paper-account connection (opt-in via --live-alpaca)
