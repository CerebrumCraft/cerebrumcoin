# CerebrumCoin Paper Trading Configuration
# Extends default.toml with paper trading overrides

# @decision DEC-PAIRS-001
# @title Expand crypto trading pairs to SOL/USD and DOGE/USD
# @status accepted
# @rationale Phase 13 proving ground expands from 2 to 4 crypto pairs. SOL and DOGE
# have sufficient liquidity on Kraken and distinct volatility profiles: SOL tracks
# BTC closely but moves faster; DOGE is more sentiment-driven. Both are supported by
# the existing symbol-agnostic architecture (signal generators, risk rules, portfolio
# tracker all key on symbol strings). Symbols must be explicit here because paper.toml
# loads standalone (not layered on default.toml).
[trading]
mode = "paper"
symbols = ["BTC/USD", "ETH/USD", "SOL/USD", "DOGE/USD"]

[paper]
initial_balance_usd = "10000.0"
commission_percent = "0.16"  # Kraken's typical maker fee
slippage_percent = "0.1"     # Conservative slippage estimate

[logging]
level = "DEBUG"
format = "console"
file = "logs/paper.log"

[signals]
# Tighten signal aggregation thresholds to reduce noise
aggregation_threshold = "0.4"  # Consensus multiplier makes 0.4 effective; 0.5 was too restrictive
aggregation_window_seconds = 120  # Up from 60s - reduce signal spam (~100/hr → ~50/hr)
rsi_oversold = 25  # Down from 30 - more extreme oversold
rsi_overbought = 75  # Up from 70 - more extreme overbought

[risk]
# Increase minimum signal strength for trade entry
min_signal_strength = "0.65"  # 0.6 → 0.65: slightly higher entry bar
# Position sizing: 3% reduces commission drag vs 2% default
position_size_percent = "5.0"  # Up from 3% — larger trades reduce commission's relative bite
# Exit rules: tighter stop-loss to cut losses faster in sideways conditions
stop_loss_percent = "1.0"    # 1.5 → 1.0%: session 13 0% WR, cut losses faster
take_profit_percent = "3.0"  # 3.0% reachable in normal ranges; 4.0% never triggered
max_position_age_minutes = 120
# Post-fill cooldown: longer cooldown to reduce churn in range-bound markets
post_fill_cooldown_seconds = 1800  # 900 → 1800: 30 min cooldown in choppy markets
# Volatility gate: deny orders when market too flat to cover commission (0.32%) + slippage (0.1%)
volatility_gate_min_range_pct = "0.5"  # 0.5% threshold; 0.32% commission + 0.1% slippage = 0.42% floor
volatility_gate_window_size = 300       # ~5 min rolling window (matches regime short window)
# SIDEWAYS suppression: deny BUY entries in low-vol sideways markets (Issue #3 fix)
sideways_suppression_min_range_pct = "1.0"  # 1.0% range required in SIDEWAYS; 3% TP unreachable in <0.5%
sideways_suppression_window_size = 18000    # ~5 hour window for session-level range assessment
# Macro volatility gate: session-level flatness detection
macro_volatility_min_range_pct = "0.8"  # Block entire session if range < 0.8% over 5 hours
macro_volatility_window_size = 18000    # ~5 hours at 1 tick/sec
# Adaptive take-profit: scale TP to actual market volatility
adaptive_tp = true
tp_multiplier = "1.5"   # effective_tp = range_pct * 1.5 (e.g. 0.4% range -> 0.6% TP)
min_tp_percent = "0.3"  # Floor: never set TP below 0.3% (covers commission)
# Commission gate: deny orders when range < commission*2*ratio (0.16%*2*2.0 = 0.64% threshold)
min_profit_to_commission_ratio = "2.0"  # 2x round-trip commission required in recent range

[monitoring]
dashboard_enabled = true
update_interval_seconds = 30
report_file_path = "data/session_report.txt"
backtest_cache_dir = "data/backtest_cache"

[regime]
window_size = 600             # 300 → 600: ~10 min window smooths micro-bounces
update_interval = 60          # 30 → 60: recalc every 60s reduces whipsaw
cumulative_trend_threshold = 0.002  # 0.003 → 0.002: catch mild drifts (ETH -0.7% missed as SIDEWAYS)
ma_slope_threshold = 0.00005
mean_return_threshold = 0.002
volatility_threshold = 0.03
ma_period = 10
buy_suppression_factor = "0.2"
buy_suppression_min_confidence = "0.8"
bear_halt_min_confidence = "0.7"   # Halt all trading when BEAR confidence >= 0.7 (session 4: 39% WR in BEAR)
long_window_size = 6000           # 3000 → 6000: ~100 min long window for macro trend
long_cumulative_threshold = 0.001  # 0.1% drift in long window triggers BEAR/BULL
min_hold_count = 3                 # Hysteresis: require 3 consecutive readings before regime transition

[strategy.range_trading]
enabled = true

