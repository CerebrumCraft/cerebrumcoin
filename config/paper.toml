# CerebrumCoin Paper Trading Configuration
# Extends default.toml with paper trading overrides

# @decision DEC-PAIRS-001
# @title Expand crypto trading pairs to SOL/USD and DOGE/USD
# @status accepted
# @rationale Phase 13 proving ground expands from 2 to 4 crypto pairs. SOL and DOGE
# have sufficient liquidity on Kraken and distinct volatility profiles: SOL tracks
# BTC closely but moves faster; DOGE is more sentiment-driven. Both are supported by
# the existing symbol-agnostic architecture (signal generators, risk rules, portfolio
# tracker all key on symbol strings). Symbols must be explicit here because paper.toml
# loads standalone (not layered on default.toml).
[trading]
mode = "paper"
symbols = ["BTC/USD", "ETH/USD", "SOL/USD", "DOGE/USD"]

[paper]
initial_balance_usd = "10000.0"
commission_percent = "0.16"  # Kraken's typical maker fee
slippage_percent = "0.1"     # Conservative slippage estimate

[logging]
level = "DEBUG"
format = "console"
file = "logs/paper.log"

[signals]
# Tighten signal aggregation thresholds to reduce noise
aggregation_threshold = "0.4"  # Consensus multiplier makes 0.4 effective; 0.5 was too restrictive
aggregation_window_seconds = 120  # Up from 60s - reduce signal spam (~100/hr → ~50/hr)
rsi_oversold = 25  # Down from 30 - more extreme oversold
rsi_overbought = 75  # Up from 70 - more extreme overbought

[risk]
# Increase minimum signal strength for trade entry
min_signal_strength = "0.65"  # 0.6 → 0.65: slightly higher entry bar
# Position sizing: 3% reduces commission drag vs 2% default
position_size_percent = "5.0"  # Up from 3% — larger trades reduce commission's relative bite
# Exit rules: tighter stop-loss to cut losses faster in sideways conditions
stop_loss_percent = "1.0"    # 1.5 → 1.0%: session 13 0% WR, cut losses faster
take_profit_percent = "3.0"  # 3.0% reachable in normal ranges; 4.0% never triggered
max_position_age_minutes = 60  # DEC-EXIT-005: >2hr holds -$216/14d (25% WR); 15-60min 40% WR
# Post-fill cooldown: longer cooldown to reduce churn in range-bound markets
post_fill_cooldown_seconds = 1800  # 900 → 1800: 30 min cooldown in choppy markets
# Volatility gate: deny orders when market too flat to cover commission (0.32%) + slippage (0.1%)
volatility_gate_min_range_pct = "0.5"  # 0.5% threshold; 0.32% commission + 0.1% slippage = 0.42% floor
volatility_gate_window_size = 300       # ~5 min rolling window (matches regime short window)
# SIDEWAYS suppression: deny BUY entries in low-vol sideways markets (Issue #3 fix)
sideways_suppression_min_range_pct = "1.5"  # DEC-TUNE-015: 1.0→1.5% range required in SIDEWAYS; session 28 showed 85% loss rate at 1.0%
sideways_suppression_window_size = 18000    # ~5 hour window for session-level range assessment
# Macro volatility gate: session-level flatness detection
macro_volatility_min_range_pct = "0.8"  # Block entire session if range < 0.8% over 5 hours
macro_volatility_window_size = 18000    # ~5 hours at 1 tick/sec
# Adaptive take-profit: scale TP to actual market volatility
adaptive_tp = true
tp_multiplier = "1.5"   # effective_tp = range_pct * 1.5 (e.g. 0.4% range -> 0.6% TP)
min_tp_percent = "0.3"  # Floor: never set TP below 0.3% (covers commission)
# Commission gate: deny orders when range < commission*2*ratio (0.16%*2*3.0 = 0.96% threshold)
min_profit_to_commission_ratio = "3.0"  # 3x round-trip commission required in recent range
max_open_positions_per_symbol = 2  # DEC-RISK-005: cap prevents position pile-up
min_hold_minutes = 15  # DEC-EXIT-006: skip SL/TP exits for first 15 min to reduce premature commission-generating exits
# --- Market hours gate (DEC-STOCKS-003) — added for stocks ---
market_hours_gate_enabled = true             # DEC-STOCKS-003: RTH-only enforcement for orb_stocks
market_hours_gate_stock_symbols = ["AAPL", "MSFT", "NVDA"]
market_hours_gate_entry_cutoff_minutes_before_close = 15
# --- End-of-day flatten (DEC-STOCKS-003) — added for stocks ---
end_of_day_flatten_enabled = true            # DEC-STOCKS-003: auto-flatten stock positions before close
end_of_day_flatten_stock_symbols = ["AAPL", "MSFT", "NVDA"]
end_of_day_flatten_offset_minutes = 5

[monitoring]
dashboard_enabled = true
update_interval_seconds = 30
report_file_path = "data/session_report.txt"
backtest_cache_dir = "data/backtest_cache"

[regime]
window_size = 600             # 300 → 600: ~10 min window smooths micro-bounces
update_interval = 60          # 30 → 60: recalc every 60s reduces whipsaw
cumulative_trend_threshold = 0.002  # 0.003 → 0.002: catch mild drifts (ETH -0.7% missed as SIDEWAYS)
ma_slope_threshold = 0.00005
mean_return_threshold = 0.002
volatility_threshold = 0.03
ma_period = 10
buy_suppression_factor = "0.2"
buy_suppression_min_confidence = "0.8"
bear_halt_min_confidence = "0.7"   # Halt all trading when BEAR confidence >= 0.7 (session 4: 39% WR in BEAR)
halt_regimes = ["BEAR", "UNKNOWN"]  # DEC-REGIME-006: block trading before regime detector has data
long_window_size = 6000           # 3000 → 6000: ~100 min long window for macro trend
long_cumulative_threshold = 0.001  # 0.1% drift in long window triggers BEAR/BULL
min_hold_count = 3                 # Hysteresis: require 3 consecutive readings before regime transition

[strategy.range_trading]
enabled = true

# Alpaca stock trading — uncomment and fill in credentials to enable
# Leave commented out for crypto-only paper trading sessions
[alpaca]
enabled = true
api_key_env = "ALPACA_API_KEY_ID"
secret_key_env = "ALPACA_API_SECRET_KEY"
paper_base_url = "https://paper-api.alpaca.markets"
data_feed = "iex"                            # free tier; use "sip" for paid
symbols = ["AAPL", "MSFT", "NVDA"]

# Hot-swappable risk profiles (Phase 14A, DEC-PROFILE-001)
# Switch profiles at runtime via ProfileManager.apply_profile(name).
# Only fields listed here are overridden — unset fields keep the base [risk]/[signals] values.

[profiles.conservative]
# Smallest positions, tightest stops, long cooldowns — for choppy or unknown-regime sessions.
position_size_percent = "3.0"
stop_loss_percent = "0.8"
take_profit_percent = "2.0"
max_position_age_minutes = 60
post_fill_cooldown_seconds = 3600
min_signal_strength = "0.75"
aggregation_threshold = "0.5"

[profiles.moderate]
# Current paper.toml values — the proven baseline from 20 sessions of tuning.
position_size_percent = "5.0"
stop_loss_percent = "1.0"
take_profit_percent = "3.0"
max_position_age_minutes = 120
post_fill_cooldown_seconds = 1800
min_signal_strength = "0.65"
aggregation_threshold = "0.4"

[profiles.aggressive]
# Larger positions, wider stops, shorter cooldowns — for high-volatility trending sessions.
position_size_percent = "7.0"
stop_loss_percent = "1.5"
take_profit_percent = "4.0"
max_position_age_minutes = 180
post_fill_cooldown_seconds = 900
min_signal_strength = "0.55"
aggregation_threshold = "0.35"

# === ORB (Opening Range Breakout) signal generator ===
[signal.opening_range]
enabled = true
range_minutes = 15
breakout_buffer_bps = 5                      # 5 bps = 0.05% past ORB high/low = breakout
min_range_bps = 20                           # reject if opening range < 0.20%
max_range_bps = 500                          # reject if opening range > 5%
symbols = ["AAPL", "MSFT", "NVDA"]

# === ORB stocks strategy ===
[strategy.orb_stocks]
enabled = true
initial_balance = 5000.0
symbols = ["AAPL", "MSFT", "NVDA"]
signal_source_filter = "OpeningRange"
aggregation_threshold = 0.4
position_size_percent = 20.0
stop_loss_percent = 0.5
take_profit_percent = 1.0
max_position_age_minutes = 390
min_hold_minutes = 5
post_fill_cooldown_seconds = 600
min_signal_strength = 0.6

[strategy.orb_stocks.weights]
technical = 1.0
sentiment = 0.0
news = 0.0
regime = 0.0

# === Kraken xStocks adapter (tokenized equities, 24/7) ===
[kraken_xstocks]
enabled = false                              # DEC-XSTOCKS-001
symbols = ["AAPLx/USD", "MSFTx/USD", "NVDAx/USD"]

# === xStocks mean-reversion strategy ===
[strategy.xstocks_reversion]
enabled = false
initial_balance = 5000.0
symbols = ["AAPLx/USD", "MSFTx/USD", "NVDAx/USD"]
aggregation_threshold = 0.4
position_size_percent = 20.0
stop_loss_percent = 1.0
take_profit_percent = 1.5
max_position_age_minutes = 120
min_hold_minutes = 15
post_fill_cooldown_seconds = 1800
min_signal_strength = 0.65

[strategy.xstocks_reversion.weights]
technical = 1.2
sentiment = 0.0
news = 0.0
regime = 0.5
