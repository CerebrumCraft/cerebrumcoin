# CerebrumCoin Default Configuration

[exchange]
name = "kraken"
testnet = false
rate_limit_per_minute = 60
websocket_enabled = true

[risk]
max_position_size_usd = "1000.0"
max_total_exposure_usd = "5000.0"
max_drawdown_percent = "5.0"
max_daily_loss_usd = "500.0"
position_size_percent = "2.0"
min_signal_strength = "0.3"
volatility_gate_min_range_pct = "0.5"  # Minimum price range % to allow trading (covers commission + slippage)
volatility_gate_window_size = 300      # Ticks per symbol (~5 min at 1 tick/sec)
min_profit_to_commission_ratio = "2.0" # CommissionGateRule: range must be >= commission_pct*2*ratio to allow trading

[paper]
initial_balance_usd = "10000.0"
commission_percent = "0.1"
slippage_percent = "0.05"
state_file = "data/paper_state.json"

[trading]
mode = "paper"
symbols = ["BTC/USD", "ETH/USD", "SOL/USD", "DOGE/USD"]
data_refresh_seconds = 1

[signals]
candle_interval_seconds = 60
rsi_period = 14
rsi_oversold = 30
rsi_overbought = 70
macd_fast = 12
macd_slow = 26
macd_signal = 9
bb_period = 20
bb_std_dev = 2.0
vwap_period = 20
aggregation_threshold = "0.3"
aggregation_window_seconds = 5

[logging]
level = "INFO"
format = "json"

[regime]
window_size = 100
update_interval = 20
cumulative_trend_threshold = 0.005
ma_slope_threshold = 0.00005
mean_return_threshold = 0.002
volatility_threshold = 0.03
ma_period = 10
buy_suppression_factor = "0.2"
buy_suppression_min_confidence = "0.8"
bear_halt_min_confidence = "0.7"
long_window_size = 3000
long_cumulative_threshold = 0.001
min_hold_count = 3  # Regime hysteresis: consecutive readings required before transition
